<!doctype html><html lang="ca"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Alerta sanitària al restaurant!</title><style>:root{font-family:system-ui,Arial;background:#101827;color:#f9fafb}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 80% 10%,#334155,#101827 60%)}main{max-width:920px;margin:auto;padding:28px 18px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center}.pill{background:#334155;border-radius:30px;padding:9px 14px;color:#cbd5e1}h1{font-size:clamp(30px,5vw,55px);margin:30px 0 10px;color:#fbbf24}h2{font-size:30px}p{line-height:1.6;color:#d1d5db}.panel{background:#1e293b;border:1px solid #475569;border-radius:22px;padding:26px;margin-top:24px;box-shadow:0 15px 40px #0004}.choices{display:grid;gap:12px;margin:22px 0}button{cursor:pointer;border:0;border-radius:12px;padding:15px 20px;font-size:17px;font-weight:700;background:#fbbf24;color:#172033}button:hover{filter:brightness(1.08)}button:focus-visible{outline:3px solid white}.choice{text-align:left;background:#334155;color:white;border:1px solid #64748b}.choice:disabled{opacity:.7;cursor:default}.choice.right{background:#166534}.choice.wrong{background:#991b1b}.muted{background:#475569;color:white}.progress{height:12px;background:#334155;border-radius:20px;overflow:hidden;margin-top:20px}.bar{height:100%;background:#fbbf24;transition:width .3s}.feedback{border-radius:12px;padding:16px;margin-top:12px;background:#0f172a;border-left:4px solid #fbbf24}.code{font-size:42px;letter-spacing:9px;color:#fbbf24;font-weight:900}.small{font-size:14px;color:#94a3b8}.hidden{display:none}.emoji{font-size:48px}input{padding:16px;font-size:24px;letter-spacing:8px;width:220px;border-radius:10px;border:2px solid #fbbf24;background:#0f172a;color:white;text-align:center}footer{margin-top:35px;color:#94a3b8;font-size:13px} @media(max-width:550px){.panel{padding:17px}.top{flex-wrap:wrap}}.timer{font-size:21px;color:#fbbf24;font-weight:900}.selected{outline:3px solid #fbbf24}.mini{font-size:13px;color:#cbd5e1}.rowbtn{display:flex;gap:8px;flex-wrap:wrap}.rowbtn button{flex:1}.hint{background:#1e40af;color:white}.warn{color:#fca5a5}.results{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:18px 0}.results>div{padding:14px;background:#334155;border-radius:12px;text-align:center}.results strong{font-size:24px;color:#fbbf24}</style></head><body><main><div class="top"><strong>🍽️ ACMP · PFI Auxiliar de Cuina</strong><span class="timer" id="timer">45:00</span><span class="pill" id="status">0/5</span></div><div class="progress"><div class="bar" id="bar" style="width:0%"></div></div><section id="screen" aria-live="polite"></section><footer>Activitat didàctica basada en l'AEA 2 · Bones pràctiques higièniques. Sense connexió a internet.</footer></main><script>const missions=[{"title": "L’uniforme sota inspecció", "emoji": "👨‍🍳", "digit": "4", "intro": "Reviseu la uniformitat abans d’obrir la cuina.", "qs": [["Una cuinera porta jaqueta neta, però el cabell li surt del gorro. Quina actuació és correcta?", ["Continuar si no toca els plats", "Recollir i cobrir tot el cabell abans de començar", "Posar-se guants per compensar-ho", "Canviar només el davantal"], 1, "El gorro ha de cobrir el cabell per evitar que caigui als aliments."], ["Un cuiner porta sabates de carrer amb sola llisa. El terra és humit. Què cal fer?", ["Treballar més a poc a poc", "Posar-hi paper al terra", "Canviar-se a calçat de treball amb sola antilliscant", "Portar dos parells de mitjons"], 2, "El calçat específic antilliscant redueix el risc de relliscades."], ["Després de manipular carn crua, el davantal queda brut. Quina és la millor decisió?", ["Eixugar-lo amb un drap i seguir", "Canviar-lo per un de net abans de continuar", "Girar-lo de l’inrevés", "Tapar la taca amb la jaqueta"], 1, "El davantal s’ha de mantenir net i canviar quan s’embruta."], ["Un ajudant s’eixuga les mans al davantal i després emplata. Quin és el problema principal?", ["Cap, el davantal és roba professional", "Només és un problema estètic", "El davantal pot transmetre brutícia als aliments", "Només cal canviar el gorro"], 2, "No s’ha d’utilitzar el davantal per eixugar les mans."]]}, {"title": "Hàbits que contaminen", "emoji": "💍", "digit": "7", "intro": "Detecteu riscos que semblen petits però no ho són.", "qs": [["Un cuiner porta anell i ungles pintades. Diu que els guants ja el protegeixen. Què ha de fer?", ["Continuar perquè els guants eliminen el risc", "Treure només l’anell", "Treure l’anell, dur les ungles curtes, netes i sense pintar, i fer higiene de mans", "Canviar els guants una vegada per hora"], 2, "Els guants no compensen una higiene personal inadequada."], ["Una cuinera tus sobre una safata de menjar llest per servir. Quina és la resposta més adequada?", ["Servir-la perquè la tos no es veu", "Apartar el menjar potencialment contaminat, rentar-se les mans i evitar tossir sobre aliments", "Afegir-hi sal", "Tapar la safata després de tossir"], 1, "Cal evitar la contaminació per gotícules i no servir aliments potencialment contaminats."], ["Un treballador mastega xiclet mentre prepara amanides. Quina explicació és la millor?", ["És correcte si no parla", "És incorrecte perquè la saliva pot arribar als aliments", "Només és incorrecte si porta mascareta", "És correcte amb el gorro posat"], 1, "No s’ha de mastegar xiclet mentre es manipulen aliments."], ["Un cuiner porta rellotge i polsera mentre utilitza una màquina talladora. Quin doble risc existeix?", ["Només embrutar l’uniforme", "Contaminació i enganxades o lesions", "Només una possible al·lèrgia", "Cap si la màquina està neta"], 1, "Les joies i objectes personals poden acumular brutícia i enganxar-se a la maquinària."]]}, {"title": "Les mans delaten", "emoji": "🧼", "digit": "2", "intro": "Cada canvi de tasca pot canviar el risc.", "qs": [["Una treballadora talla pollastre cru, es renta les mans, consulta el mòbil i prepara una amanida. Quin error comet?", ["Consultar una recepta", "No tornar-se a rentar les mans després del mòbil", "Rentar-se les mans després del pollastre", "Preparar amanida"], 1, "Cal rentar-se les mans després de tocar el mòbil i abans de manipular aliments."], ["Un ajudant toca cartrons, obre la porta i comença a tallar fruita. Quina seqüència és correcta?", ["Tallar fruita i rentar-se les mans al final", "Posar-se un davantal nou", "Rentar-se les mans abans de tocar la fruita", "Netejar només el ganivet"], 2, "Cartrons i poms de porta són punts de contacte que obliguen a recuperar la higiene de mans."], ["Un cuiner es moca i immediatament continua decorant postres. Què hauria de fer?", ["Rentar-se les mans abans de reprendre la manipulació", "Canviar només el gorro", "Posar-se un guant sobre la mà sense rentar", "Continuar si ha utilitzat un mocador"], 0, "Després de mocar-se cal rentar-se les mans."], ["Després d’anar al lavabo, un treballador diu que les mans semblen netes. Quina resposta és correcta?", ["No cal rentar-les si no hi ha brutícia visible", "Només cal posar-se guants", "Cal rentar-se les mans igualment", "N’hi ha prou amb eixugar-les al davantal"], 2, "El rentat de mans és necessari després d’anar al lavabo, encara que semblin netes."]]}, {"title": "La trampa dels guants", "emoji": "🧤", "digit": "9", "intro": "Els guants poden crear una falsa sensació de seguretat.", "qs": [["Amb els mateixos guants, un cuiner toca carn crua, una caixa i aliments llestos per servir. Què hauria de fer?", ["Continuar perquè porta guants", "Esbandir els guants amb aigua", "Canviar-los només quan es trenquin", "Retirar-los, rentar-se les mans i posar-ne de nous si la tasca ho requereix"], 3, "Cal canviar de guants quan es canvia d’activitat; els guants no substitueixen la higiene de mans."], ["Una treballadora es posa guants nous sense rentar-se les mans. Quina afirmació és correcta?", ["És suficient perquè són nous", "Cal rentar-se i assecar-se bé les mans abans de posar-se’ls", "Només cal si els guants són blaus", "Cal rentar els guants, no les mans"], 1, "La higiene de mans s’ha de fer abans de posar-se els guants."], ["Quin criteri s’ajusta al dossier quan calen guants d’un sol ús?", ["Prioritzar vinil o nitril per evitar possibles al·lèrgies al làtex", "Utilitzar sempre guants de llana", "Escollir guants reutilitzats", "Fer servir guants de qualsevol material sense canviar-los"], 0, "El dossier recomana vinil o nitril."], ["Un cuiner cobra a caixa amb guants i torna a preparar entrepans. Què cal fer?", ["Continuar perquè no ha tocat menjar cru", "Canviar de guants i fer la higiene de mans necessària", "Eixugar els guants al davantal", "Posar-se un segon guant al damunt"], 1, "Cobrar és un canvi d’activitat: cal retirar els guants i recuperar la higiene adequada."]]}, {"title": "Emergència al servei", "emoji": "🩹", "digit": "5", "intro": "Resoleu incidències abans que arribin als plats.", "qs": [["Un treballador es talla un dit, es posa una tireta normal i continua preparant entrepans. Quina actuació és correcta?", ["Afegir dos guants sobre la tireta normal", "Netejar la ferida, protegir-la amb apòsit impermeable i utilitzar guant protector si reprèn la manipulació", "Continuar si ja no sagna", "Netejar la ferida en acabar el servei"], 1, "La ferida ha d’estar ben protegida; a la mà, també amb guant si es reprèn la feina."], ["Una cuinera té una ferida profunda que supura i no es pot aïllar correctament. Què ha de fer?", ["Tapar-la amb paper de cuina", "Continuar amb dos guants", "Deixar de manipular aliments i comunicar-ho per reassignar tasques", "Rentar-se les mans només al final"], 2, "No pot manipular aliments si la ferida no es pot protegir de manera segura."], ["Un treballador es crema amb una safata calenta. Quina resposta inicial és adequada?", ["Posar-hi mantega", "Refredar la cremada amb aigua corrent i valorar la protecció de la zona", "Aplicar farina", "Continuar sense revisar la lesió"], 1, "Cal refredar amb aigua corrent; no aplicar remeis casolans."], ["A la inspecció final hi ha un cuiner amb rellotge, un altre que s’eixuga les mans al davantal i una treballadora que tus sobre els aliments. Què fa el responsable?", ["Corregir només la persona que tus", "Permetre continuar perquè són errors lleus", "Aturar les pràctiques incorrectes, corregir-les i valorar els aliments potencialment contaminats", "Canviar només els davantals"], 2, "Cal corregir totes les pràctiques insegures i valorar la possible contaminació."]]}];
const challenges=[{"title": "Detecta els cinc errors", "kind": "multi", "prompt": "A la cuina, abans del servei, què cal corregir? Seleccioneu exactament les cinc males pràctiques.", "options": ["El cabell queda fora del gorro", "El davantal s’utilitza per eixugar les mans", "El calçat té sola antilliscant", "Hi ha un rellotge al canell", "La jaqueta és neta i professional", "Les sabates són de carrer i rellisquen", "El davantal és brut després de manipular carn crua"], "correct": [0, 1, 3, 5, 6], "explain": "Cal cobrir el cabell, no eixugar-se al davantal, retirar joies i rellotge, portar calçat adequat i canviar el davantal brut."}, {"title": "Ordena el rentat de mans", "kind": "order", "prompt": "Després de tocar el mòbil, ordeneu les accions per tornar a manipular aliments.", "steps": ["Mullar-se les mans amb aigua", "Aplicar sabó", "Fregar bé mans, dits i ungles", "Esbandir amb aigua", "Assecar-se amb un sistema higiènic"], "explain": "Cal rentar-se les mans després de tocar objectes com el mòbil i abans de manipular aliments."}, {"title": "Decisions amb conseqüències", "kind": "branch", "prompt": "Una cuinera porta guants. Ha manipulat carn crua, després una caixa i ara ha de preparar entrepans.", "stages": [{"q": "Què fa primer?", "options": ["Esbandeix els guants i continua", "Es treu els guants utilitzats", "Es posa un segon parell a sobre"], "correct": 1, "why": "Els guants contaminats s'han de retirar."}, {"q": "Abans de reprendre la preparació, què fa?", "options": ["Es renta i s'asseca bé les mans", "S'eixuga les mans al davantal", "Es posa guants nous sense rentar-se"], "correct": 0, "why": "Els guants no substitueixen el rentat de mans."}, {"q": "Ara que manipula entrepans, què és correcte?", "options": ["Ha de dur sempre guants encara que no calguin", "Pot treballar amb mans netes o guants nous si la tasca ho requereix", "Pot reutilitzar els guants de la carn"], "correct": 1, "why": "La guia recomana una higiene freqüent i guants per a manipulacions concretes."}], "explain": "Retirar els guants, rentar-se i assecar-se les mans i posar-se guants nous només si cal."}, {"title": "Reconstrueix l'incident", "kind": "multi", "prompt": "Tres testimonis expliquen el servei. Marqueu totes les actuacions que obliguen a intervenir.", "options": ["La Laia es fa un tall, el cobreix amb un apòsit impermeable i un guant net", "En Pol es crema i es posa mantega a la lesió", "L'Èric té una ferida que supura i continua preparant plats", "La Jana es crema i refreda la zona amb aigua corrent", "En Marc es talla i segueix treballant amb una tireta no impermeable"], "correct": [1, 2, 4], "explain": "No s'ha d'aplicar mantega; una ferida que supura i no es pot aïllar impedeix manipular aliments; una tireta no impermeable és insuficient."}, {"title": "Inspecció final: el veredicte", "kind": "multi", "prompt": "En una cuina, una treballadora tus sobre un plat preparat, un cuiner porta anell i un altre cobra amb els mateixos guants que fa servir per preparar aliments. Quines decisions són correctes?", "options": ["Separar i no servir el plat potencialment contaminat", "Permetre l'anell si el cuiner porta guants", "Retirar l'anell abans de manipular aliments", "Retirar els guants usats per cobrar i rentar-se les mans", "Deixar el plat perquè ja estava acabat", "Corregir les tres situacions abans de continuar"], "correct": [0, 2, 3, 5], "explain": "S'ha de protegir l'aliment potencialment contaminat i corregir totes les pràctiques inadequades."}];

let teamName='',startTime=null;let m=0,q=0,phase='intro',wrong=0,score=0,hints=3,unlocked=[],selected=[],sequence=[],stage=0,finished=false,deadline=null,ticker=null,answered=false;
const el=document.getElementById('screen');
function progress(){document.getElementById('bar').style.width=(unlocked.length/5*100)+'%';document.getElementById('status').textContent='Claus '+unlocked.length+'/5 · Punts '+score+' · Pistes '+hints;}
function startTimer(){if(ticker)clearInterval(ticker);deadline=Date.now()+45*60*1000;ticker=setInterval(tick,250);tick()}
function tick(){if(!deadline||finished)return;let s=Math.max(0,Math.ceil((deadline-Date.now())/1000));document.getElementById('timer').textContent=String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');if(s<=0){finishGame(false)} }
function intro(){progress();el.innerHTML='<h1>🚨 Alerta sanitària al restaurant!</h1><div class="panel"><h2>🔐 Inspecció sanitària · Nivell expert</h2><p>Disposeu de <strong>45 minuts</strong> per resoldre 20 preguntes i 5 missions especials. Cada bloc té 4 preguntes i una prova de desbloqueig.</p><p>Pregunta correcta: +10 punts · Missió especial: +20 punts · Error: −5 punts (mínim 0) · 3 pistes per partida.</p><p>El cronòmetre no s’atura. Anoteu les cinc xifres i obriu el pany abans que s’acabi el temps.</p><label for="teamName" class="small">Nom de l’equip</label><p><input id="teamName" maxlength="60" style="width:min(100%,420px);font-size:20px;letter-spacing:0;text-align:left" placeholder="Ex.: Els Cuiners 2" autocomplete="off"></p><p id="nameError" style="color:#fca5a5"></p><button onclick="start()">Començar el compte enrere ▶</button></div>'}
function start(){let field=document.getElementById('teamName');let name=field?field.value.trim():'';if(!name){document.getElementById('nameError').textContent='Escriviu el nom de l’equip per començar.';field.focus();return}teamName=name.slice(0,60);startTime=Date.now();startTimer();question()}
function penalize(msg){wrong++;score=Math.max(0,score-5);progress();return '<div class="feedback warn">❌ '+msg+' −5 punts. Torneu-ho a provar.</div>'}
function hint(){if(hints<1||finished)return;hints--;progress();let t=phase==='question'?missions[m].qs[q][3]:challenges[m].explain;document.getElementById('hintbox').textContent='💡 Pista: '+t}
function hintButton(){return '<button class="hint" onclick="hint()" '+(hints<1?'disabled':'')+'>💡 Demanar pista ('+hints+')</button><p id="hintbox" class="mini"></p>'}
function question(){if(finished)return;phase='question';answered=false;progress();let a=missions[m],x=a.qs[q];el.innerHTML='<p class="small">BLOC '+(m+1)+'/5 · PREGUNTA '+(q+1)+'/4</p><h1>'+a.emoji+' '+a.title+'</h1><div class="panel"><h2>'+x[0]+'</h2><div class="choices">'+x[1].map((v,i)=>'<button class="choice" id="c'+i+'" onclick="answer('+i+')">'+String.fromCharCode(65+i)+'. '+v+'</button>').join('')+'</div><div id="feedback"></div>'+hintButton()+'</div>'}
function answer(i){if(answered||finished)return;let x=missions[m].qs[q],correct=i===x[2];if(!correct){document.getElementById('feedback').innerHTML=penalize('Aquesta resposta no és correcta.');return}answered=true;score+=10;progress();document.querySelectorAll('.choice').forEach(b=>b.disabled=true);document.getElementById('c'+i).classList.add('right');document.getElementById('feedback').innerHTML='<div class="feedback">✅ '+x[3]+'</div><p><button onclick="nextQuestion()">'+(q===3?'Anar a la missió especial →':'Següent pregunta →')+'</button></p>'}
function nextQuestion(){if(q<3){q++;question()}else{selected=[];sequence=[];stage=0;challenge()}}
function challenge(){if(finished)return;phase='challenge';progress();let c=challenges[m],body='';if(c.kind==='multi'){body='<p class="mini">Seleccioneu totes les opcions correctes. Una selecció incompleta o incorrecta penalitza.</p><div class="choices">'+c.options.map((v,i)=>'<button class="choice" id="s'+i+'" onclick="toggle('+i+')">'+v+'</button>').join('')+'</div><button onclick="checkMulti()">Comprovar selecció</button>'}else if(c.kind==='order'){body='<p class="mini">Cliqueu els passos en l’ordre correcte. Podeu reiniciar la seqüència.</p><div class="choices">'+c.steps.map((v,i)=>'<button class="choice" id="s'+i+'" onclick="pick('+i+')">'+v+'</button>').join('')+'</div><p id="order" class="mini">Ordre: —</p><button class="muted" onclick="sequence=[];challenge()">Reiniciar ordre</button> <button onclick="checkOrder()">Validar ordre</button>'}else{let st=c.stages[stage];body='<p class="mini">Decisió '+(stage+1)+' de '+c.stages.length+'</p><h2>'+st.q+'</h2><div class="choices">'+st.options.map((v,i)=>'<button class="choice" onclick="checkStage('+i+')">'+v+'</button>').join('')+'</div>'}el.innerHTML='<p class="small">BLOC '+(m+1)+'/5 · PROVA DE DESBLOQUEIG</p><h1>🧩 '+c.title+'</h1><div class="panel"><p>'+c.prompt+'</p>'+body+'<div id="feedback"></div>'+hintButton()+'</div>'}
function toggle(i){let at=selected.indexOf(i);if(at>=0)selected.splice(at,1);else selected.push(i);document.getElementById('s'+i).classList.toggle('selected')}
function checkMulti(){let a=[...selected].sort((x,y)=>x-y),b=[...challenges[m].correct].sort((x,y)=>x-y);if(JSON.stringify(a)!==JSON.stringify(b)){document.getElementById('feedback').innerHTML=penalize('Reviseu quines pràctiques són incorrectes.');return}completeChallenge()}
function pick(i){if(sequence.includes(i))return;sequence.push(i);document.getElementById('s'+i).disabled=true;document.getElementById('order').textContent='Ordre: '+sequence.map(n=>challenges[m].steps[n]).join(' → ')}
function checkOrder(){if(sequence.length!==challenges[m].steps.length||sequence.some((v,i)=>v!==i)){document.getElementById('feedback').innerHTML=penalize('L’ordre no és correcte. Reinicieu-lo i torneu a provar.');return}completeChallenge()}
function checkStage(i){let s=challenges[m].stages[stage];if(i!==s.correct){document.getElementById('feedback').innerHTML=penalize('La decisió comporta risc: '+s.why);return}stage++;if(stage===challenges[m].stages.length)completeChallenge();else challenge()}
function completeChallenge(){score+=20;unlocked.push(missions[m].digit);progress();el.innerHTML='<h1>🔑 Bloc desbloquejat!</h1><div class="panel"><h2>Missió especial superada · +20 punts</h2><p>'+challenges[m].explain+'</p><p>La xifra '+(m+1)+' és:</p><div class="code">'+missions[m].digit+'</div><p>Codi acumulat: '+unlocked.join(' · ')+'</p><button onclick="advance()">'+(m===4?'Introduir el codi final →':'Següent bloc →')+'</button></div>'}
function advance(){if(m===4)lock();else{m++;q=0;question()}}
function lock(){phase='lock';el.innerHTML='<h1>🔒 El pany final</h1><div class="panel"><p>Introduïu les cinc xifres en l’ordre dels blocs.</p><input id="pin" inputmode="numeric" maxlength="5" aria-label="Codi secret"><p><button onclick="verify()">Obrir el restaurant</button></p><div id="feedback"></div></div>'}
function fmtTime(seconds){return String(Math.floor(seconds/60)).padStart(2,'0')+':'+String(seconds%60).padStart(2,'0')}
function escapeHtml(t){return String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function finishGame(won){if(finished)return;finished=true;clearInterval(ticker);let elapsed=won?Math.floor((Date.now()-startTime)/1000):2700;let result={equip:teamName,estat:won?'Completat':'Temps esgotat',punts:score,temps:fmtTime(elapsed),errors:wrong,pistes_utilitzades:3-hints,blocs:unlocked.length};window.lastResult=result;el.innerHTML='<h1>'+(won?'🏆 Restaurant obert!':'⏰ Temps esgotat!')+'</h1><div class="panel"><h2>Resultat de l’equip: '+escapeHtml(teamName)+'</h2><p>Estat: <strong>'+result.estat+'</strong></p><div class="results"><div>⭐ <strong>'+score+'</strong><br>Punts</div><div>⏱️ <strong>'+result.temps+'</strong><br>Temps</div><div>❌ <strong>'+wrong+'</strong><br>Errors</div><div>💡 <strong>'+result.pistes_utilitzades+'/3</strong><br>Pistes usades</div></div><p>Blocs desbloquejats: '+unlocked.length+'/5. Compareu primer els equips que han acabat, després la puntuació i, en cas d’empat, el temps.</p><p><button onclick="downloadResult()">⬇ Descarregar resultat CSV</button> <button class="muted" onclick="copyResult()">📋 Copiar resultat</button></p><p id="exportMsg" class="small">Descarregueu el resultat i lliureu-lo a Classroom.</p><button class="muted" onclick="restart()">Tornar a jugar</button></div>'}
function downloadResult(){let r=window.lastResult;if(!r)return;let cols=['equip','estat','punts','temps','errors','pistes_utilitzades','blocs'];let csv='\uFEFF'+cols.join(';')+'\r\n'+cols.map(k=>'"'+String(r[k]).replace(/"/g,'""')+'"').join(';')+'\r\n';let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='resultat_ACMP_'+r.equip.replace(/[^a-z0-9_-]/gi,'_').slice(0,35)+'.csv';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function copyResult(){let r=window.lastResult;if(!r)return;let t='Equip: '+r.equip+' | Estat: '+r.estat+' | Punts: '+r.punts+' | Temps: '+r.temps+' | Errors: '+r.errors+' | Pistes: '+r.pistes_utilitzades+' | Blocs: '+r.blocs+'/5';if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(t).then(()=>document.getElementById('exportMsg').textContent='Resultat copiat.').catch(()=>prompt('Copieu el resultat:',t))}else prompt('Copieu el resultat:',t)}
function verify(){let pin=document.getElementById('pin').value;if(pin!==missions.map(x=>x.digit).join('')){document.getElementById('feedback').innerHTML=penalize('Codi incorrecte.');return}finishGame(true)}
function restart(){if(ticker)clearInterval(ticker);m=0;q=0;wrong=0;score=0;hints=3;unlocked=[];selected=[];sequence=[];stage=0;finished=false;deadline=null;teamName='';startTime=null;document.getElementById('timer').textContent='45:00';intro()}
intro();
</script></body></html>
